version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: woka-staging-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-woka_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging_pass_woka_2026}
      POSTGRES_DB: ${POSTGRES_DB:-woka_staging}
    volumes:
      - staging-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woka_staging"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: woka-staging-backend
    restart: always
    env_file:
      - .env.staging
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: woka-staging-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=https://localhost:8443/api/v1
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: woka-staging-nginx
    restart: always
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./staging/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./staging/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend

volumes:
  staging-db-data:
