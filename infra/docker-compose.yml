version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: woka-reel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-woka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-woka_dev_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-woka_reel_intelligence}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-woka} -d ${POSTGRES_DB:-woka_reel_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: woka-reel-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.backend
    container_name: woka-reel-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DATABASE_URL=postgresql://${POSTGRES_USER:-woka}:${POSTGRES_PASSWORD:-woka_dev_password_2026}@postgres:5432/${POSTGRES_DB:-woka_reel_intelligence}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-woka-dev-secret-key-at-least-32-chars-long-2026}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-N0NlbmRfdG9rZW5fZW5jcnlwdGlvbl9zdGFnaW5nOTk=}
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - media_storage:/app/media_storage

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.frontend
    container_name: woka-reel-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:
  media_storage:
